# Serveur web du conteneur frontend uSwap.
#
# Le backend NestJS n'a AUCUN prefixe global (`app.setGlobalPrefix('')` dans
# backend_new/src/main.ts) : les routes sont /auth/login, /users, /plannings...
# Le frontend appelle pourtant "/api/..." (VITE_API_URL=/api). Le proxy retire
# donc le prefixe /api, exactement comme le fait vite.config.ts en developpement.
#
# Cookie de session : le refresh token est un cookie HttpOnly SameSite=Lax.
# Navigateur et API doivent partager la meme origine, d'ou ce proxy.

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Taille maximale des pieces jointes (justificatifs d'absence : 5 Mo).
    client_max_body_size 10m;

    # En-tetes de securite de base. La CSP est volontairement omise ici :
    # elle depend du domaine final et doit etre validee apres deploiement.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Sonde de sante du conteneur.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Service worker et manifeste : jamais mis en cache agressivement, sinon
    # une nouvelle version de l'application n'est pas detectee.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Fichiers versionnes produits par Vite (noms hashes) : cache long.
    location /assets/ {
        include /etc/nginx/mime.types;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API : /api/xxx -> http://backend:3000/xxx
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        # $http_host conserve le port (127.0.0.1:8080 en test local), ce que
        # $host supprime : le backend voit alors une origine differente.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cookie de refresh recu en HttpOnly/Secure : inchange jusqu'au client.
        proxy_pass_header Set-Cookie;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Swagger : le backend l'expose sur /docs (SwaggerModule.setup('docs')).
    # La barre oblique finale de proxy_pass reecrit /api-docs/... -> /docs/... .
    location /api-docs {
        proxy_pass http://backend:3000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Routage SPA : toute autre URL renvoie index.html (React Router), y compris
    # apres actualisation directe de /app/admin/... (BrowserRouter).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
