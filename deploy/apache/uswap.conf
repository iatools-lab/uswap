# =============================================================================
# uSwap — VirtualHost Apache (reverse proxy vers le conteneur frontend)
#
# A INSTALLER PAR LE SUPERVISEUR, jamais automatiquement :
#   sudo cp deploy/apache/uswap.conf /etc/apache2/sites-available/uswap.conf
#   sudo nano /etc/apache2/sites-available/uswap.conf     # remplacer uswap.example.org
#   sudo a2ensite uswap.conf
#   sudo apache2ctl configtest                            # DOIT afficher Syntax OK
#   sudo systemctl reload apache2
#
# Ce fichier ne modifie AUCUN autre site : il ajoute un VirtualHost dedie.
# Les autres VirtualHosts du serveur restent inchanges.
#
# Prerequis (une seule fois) :
#   sudo a2enmod proxy proxy_http headers ssl rewrite
#   sudo systemctl restart apache2
#
# Certificat : si certbot est deja installe, lancer
#   sudo certbot --apache -d uswap.example.org
# et laisser certbot completer les lignes ssl_certificate ci-dessous.
# =============================================================================

# --- Redirection HTTP -> HTTPS ----------------------------------------------
<VirtualHost *:80>
    ServerName uswap.example.org

    # Laissez cette ligne si certbot gere le defi ACME.
    # Sinon, decommentez la redirection ci-dessous.
    # Redirect permanent / https://uswap.example.org/

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>

# --- HTTPS ------------------------------------------------------------------
<VirtualHost *:443>
    ServerName uswap.example.org

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/uswap.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/uswap.example.org/privkey.pem

    # Pieces jointes (justificatifs d'absence) : 5 Mo cote application.
    # Le conteneur frontend accepte 10 Mo ; Apache doit accepter autant.
    LimitRequestBody 10485760

    # Le conteneur frontend (Nginx) fait deja le routage SPA et le proxy /api.
    # Apache ne fait que transmettre, sans reecrire les chemins.
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:8080/ retry=0
    ProxyPassReverse / http://127.0.0.1:8080/

    # En-tetes transmis au conteneur : le backend en a besoin pour construire
    # les liens d'invitation et pour le cookie de session (origine unique).
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    # Delais : une generation de rapport peut prendre quelques secondes.
    ProxyTimeout 120

    ErrorLog  ${APACHE_LOG_DIR}/uswap-error.log
    CustomLog ${APACHE_LOG_DIR}/uswap-access.log combined
</VirtualHost>
